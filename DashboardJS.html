<script>
/**
 * SISTEMA DE TELEFONES TJES - consulta pública
 * Consulta agrupada por comarca/microrregião.
 */

const URL_MAPA_ESPIRITO_SANTO = "https://drive.google.com/uc?export=view&id=1vDH3BCV4hURwHxImjvRa3nrhMJ7KdGpR";

let todosTelefones = [];
let setoresPorComarca = {};
let telefonesPorSetor = {};
let microrregioesConsulta = {};
let microrregiaoConsultaAtual = "";

function normalizarChaveConsulta(valor) {
  return String(valor == null ? "" : valor)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9]/g, "")
    .toUpperCase();
}

function escaparConsulta(valor) {
  return String(valor == null ? "" : valor)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function valorConsulta(obj, ...nomes) {
  if (!obj || typeof obj !== "object") return "";
  const chaves = Object.keys(obj);
  for (const nome of nomes) {
    if (Object.prototype.hasOwnProperty.call(obj, nome)) return obj[nome];
    const alvo = normalizarChaveConsulta(nome);
    const chave = chaves.find(k => normalizarChaveConsulta(k) === alvo);
    if (chave !== undefined) return obj[chave];
  }
  return "";
}

function normalizarConsulta(valor) {
  return String(valor == null ? "" : valor)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function iniciarConsultaTelefones() {
  if (typeof API === "undefined") {
    setTimeout(iniciarConsultaTelefones, 200);
    return;
  }

  API.listarTelefones(function(resp) {
    if (resp && resp.sucesso) {
      todosTelefones = Array.isArray(resp.dados) ? resp.dados : [];
      processarDados();
      preencherMicrorregioesConsulta();
      renderizarComarcas();
      mostrarMapaConsulta();
    } else {
      mostrarErroConsulta("Erro ao carregar os telefones.");
    }
  }, function() {
    mostrarErroConsulta("Falha na comunicação com a base de dados.");
  });
}

function mostrarErroConsulta(mensagem) {
  const lista = document.getElementById("consulta-lista");
  if (lista) lista.innerHTML = '<div class="consulta-error-state">' + escaparConsulta(mensagem) + '</div>';
}

function processarDados() {
  setoresPorComarca = {};
  telefonesPorSetor = {};
  microrregioesConsulta = {};

  todosTelefones.forEach(tel => {
    const comarca = String(valorConsulta(tel, "comarca", "Comarca") || "Sem comarca").trim();
    const setor = String(valorConsulta(tel, "setor", "Setor") || "Sem setor").trim();
    const micro = String(valorConsulta(tel, "microrregiao", "Microrregiao", "microrregião", "Microregiao") || "Sem microrregião").trim();
    const chaveSetor = comarca + "||" + setor;

    if (!setoresPorComarca[comarca]) setoresPorComarca[comarca] = new Set();
    setoresPorComarca[comarca].add(setor);

    if (!telefonesPorSetor[chaveSetor]) telefonesPorSetor[chaveSetor] = [];
    telefonesPorSetor[chaveSetor].push(tel);

    if (!microrregioesConsulta[micro]) microrregioesConsulta[micro] = new Set();
    microrregioesConsulta[micro].add(comarca);
  });

  Object.keys(setoresPorComarca).forEach(comarca => {
    setoresPorComarca[comarca] = Array.from(setoresPorComarca[comarca]).sort((a, b) => a.localeCompare(b, "pt-BR"));
  });
}

function preencherMicrorregioesConsulta() {
  const select = document.getElementById("filtro-microrregiao-consulta");
  if (!select) return;

  select.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Selecione uma microrregião";
  select.appendChild(placeholder);

  Object.keys(microrregioesConsulta)
    .sort((a, b) => a.localeCompare(b, "pt-BR"))
    .forEach(micro => {
      const option = document.createElement("option");
      option.value = micro;
      option.textContent = micro;
      select.appendChild(option);
    });
}

function selecionarMicrorregiaoConsulta() {
  const select = document.getElementById("filtro-microrregiao-consulta");
  microrregiaoConsultaAtual = select ? select.value : "";
  const campo = document.getElementById("campo-pesquisa-consulta");
  if (campo) campo.value = "";
  renderizarComarcas();
  mostrarMapaConsulta();
}

function obterComarcasMicrorregiao() {
  if (!microrregiaoConsultaAtual) return [];
  const conjunto = microrregioesConsulta[microrregiaoConsultaAtual];
  return conjunto ? Array.from(conjunto).sort((a, b) => a.localeCompare(b, "pt-BR")) : [];
}

function renderizarComarcas() {
  const container = document.getElementById("consulta-lista");
  if (!container) return;

  if (!microrregiaoConsultaAtual) {
    container.innerHTML = '<div class="consulta-empty-state"><div class="consulta-empty-icon">🗺️</div><strong>Selecione uma microrregião</strong><span>A lista de comarcas será exibida aqui.</span></div>';
    return;
  }

  const campo = document.getElementById("campo-pesquisa-consulta");
  const termo = normalizarConsulta(campo ? campo.value : "");
  const comarcas = obterComarcasMicrorregiao().filter(c => !termo || normalizarConsulta(c).includes(termo));

  if (!comarcas.length) {
    container.innerHTML = '<div class="consulta-empty-state"><strong>Nenhuma comarca encontrada</strong><span>Tente outro termo de pesquisa.</span></div>';
    return;
  }

  const fragment = document.createDocumentFragment();
  comarcas.forEach(comarca => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "comarca-item";

    const nome = document.createElement("span");
    nome.className = "comarca-nome";
    nome.textContent = comarca;

    const quantidade = document.createElement("span");
    quantidade.className = "setor-count";
    quantidade.textContent = String((setoresPorComarca[comarca] || []).length) + " setores";

    item.appendChild(nome);
    item.appendChild(quantidade);
    item.addEventListener("click", () => selecionarComarcaConsulta(comarca));
    fragment.appendChild(item);
  });

  container.replaceChildren(fragment);
}

function filtrarComarcasConsulta() {
  renderizarComarcas();
}

function filtrarSetoresConsulta() {
  filtrarComarcasConsulta();
}

function selecionarComarcaConsulta(comarca) {
  document.querySelectorAll(".comarca-item").forEach(el => el.classList.remove("active"));
  const alvo = normalizarConsulta(comarca);
  Array.from(document.querySelectorAll(".comarca-item")).forEach(el => {
    const nome = el.querySelector(".comarca-nome");
    if (nome && normalizarConsulta(nome.textContent) === alvo) el.classList.add("active");
  });
  renderizarSetoresDaComarca(comarca);
}

function renderizarSetoresDaComarca(comarca) {
  const container = document.getElementById("consulta-detalhes");
  if (!container) return;

  const setores = setoresPorComarca[comarca] || [];
  let html = '<div class="consulta-detalhes-card">' +
    '<div class="consulta-detalhes-header"><div><span class="consulta-breadcrumb">' + escaparConsulta(microrregiaoConsultaAtual) + '</span><h3>' + escaparConsulta(comarca) + '</h3><p>' + setores.length + ' setores</p></div><button type="button" class="btn btn-secondary btn-voltar-mapa" onclick="mostrarMapaConsulta()">← Voltar ao mapa</button></div>';

  if (!setores.length) {
    html += '<div class="consulta-empty-state"><strong>Nenhum setor cadastrado.</strong></div></div>';
    container.innerHTML = html;
    return;
  }

  setores.forEach(setor => {
    const chave = comarca + "||" + setor;
    html += renderizarTabelaSetor(setor, telefonesPorSetor[chave] || []);
  });

  html += '</div>';
  container.innerHTML = html;
}

function formatarWhatsappConsulta(valor) {
  let digits = String(valor == null ? "" : valor).replace(/\D/g, "");
  if (digits.startsWith("55") && digits.length === 13) digits = digits.substring(2);
  if (digits.length === 11) return "(" + digits.substring(0, 2) + ") " + digits.substring(2, 7) + "-" + digits.substring(7);
  if (digits.length === 10) return "(" + digits.substring(0, 2) + ") " + digits.substring(2, 6) + "-" + digits.substring(6);
  return String(valor || "-");
}

function numeroWhatsappConsulta(valor) {
  let digits = String(valor == null ? "" : valor).replace(/\D/g, "");
  if (digits.length === 10 || digits.length === 11) digits = "55" + digits;
  if (digits.length !== 12 && digits.length !== 13) return "";
  return digits;
}

function linkWhatsappConsulta(valor) {
  const numero = numeroWhatsappConsulta(valor);
  if (!numero) return escaparConsulta(formatarWhatsappConsulta(valor));
  return '<a class="consulta-whatsapp-link" href="https://wa.me/' + numero + '" target="_blank" rel="noopener noreferrer" title="Abrir no WhatsApp">💬 ' + escaparConsulta(formatarWhatsappConsulta(valor)) + '</a>';
}

function juntarValores(contatos, ...campos) {
  const valores = [];
  contatos.forEach(c => {
    const valor = String(valorConsulta(c, ...campos) || "").trim();
    if (valor && !valores.some(v => normalizarConsulta(v) === normalizarConsulta(valor))) valores.push(valor);
  });
  return valores;
}

function renderizarTabelaSetor(setor, contatos) {
  // Mantém o relacionamento entre os campos do mesmo registro.
  // Não usa arrays independentes por coluna, evitando misturar telefone de A com WhatsApp de B.
  const registros = contatos.map((contato, indice) => ({
    indice,
    telefone: String(valorConsulta(contato, "telefone", "numero", "Telefone", "Numero") || "").trim(),
    ramal: String(valorConsulta(contato, "ramal", "Ramal") || "").trim(),
    whatsapp: String(valorConsulta(contato, "whatsapp", "Whatsapp", "WhatsApp", "WHATSAPP") || "").trim(),
    email: String(valorConsulta(contato, "email", "e-mail", "E-mail", "EMAIL") || "").trim(),
    endereco: String(valorConsulta(contato, "endereco", "Endereco", "ENDERECO") || "").trim()
  }));

  // Remove duplicidades exatas sem perder registros que tenham tipos diferentes.
  const unicos = registros.filter((registro, indice, array) => {
    return array.findIndex(outro =>
      outro.telefone === registro.telefone &&
      outro.ramal === registro.ramal &&
      outro.whatsapp === registro.whatsapp &&
      outro.email === registro.email &&
      outro.endereco === registro.endereco
    ) === indice;
  });

  const linhas = unicos.length ? unicos : [{ telefone: "", ramal: "", whatsapp: "", email: "", endereco: "" }];
  let html = '<section class="consulta-setor-card"><div class="consulta-setor-title"><h4>' + escaparConsulta(setor) + '</h4></div><div class="consulta-table-wrap"><table class="data-table consulta-contatos-table"><thead><tr><th>Telefone</th><th>Ramal</th><th>WhatsApp</th><th>E-mail</th></tr></thead><tbody>';

  linhas.forEach(registro => {
    html += '<tr>' +
      '<td>' + escaparConsulta(registro.telefone || "-") + '</td>' +
      '<td>' + escaparConsulta(registro.ramal || "-") + '</td>' +
      '<td>' + (registro.whatsapp ? linkWhatsappConsulta(registro.whatsapp) : '-') + '</td>' +
      '<td>' + escaparConsulta(registro.email || "-") + '</td>' +
      '</tr>';
  });

  html += '</tbody></table></div>';

  const enderecos = [];
  unicos.forEach(registro => {
    if (registro.endereco && !enderecos.some(e => normalizarConsulta(e) === normalizarConsulta(registro.endereco))) enderecos.push(registro.endereco);
  });

  if (enderecos.length) {
    html += '<div class="consulta-endereco"><strong>Endereço:</strong> ' + escaparConsulta(enderecos.join(" • ")) + '</div>';
  }

  html += '</section>';
  return html;
}

function mostrarMapaConsulta() {
  const container = document.getElementById("consulta-detalhes");
  if (!container) return;

  container.innerHTML =
    '<div id="consulta-mapa-container" class="consulta-mapa-container" aria-label="Mapa do Espírito Santo">' +
      '<img class="consulta-mapa-imagem" src="' + URL_MAPA_ESPIRITO_SANTO + '" alt="Mapa do Espírito Santo com microrregiões e comarcas" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
      '<div class="consulta-mapa-placeholder">' +
        '<div class="consulta-map-icon">🗺️</div>' +
        '<strong>Não foi possível carregar o mapa</strong>' +
        '<span>Verifique se o arquivo do Google Drive está compartilhado como “qualquer pessoa com o link”.</span>' +
      '</div>' +
    '</div>';
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", iniciarConsultaTelefones, { once: true });
} else {
  iniciarConsultaTelefones();
}
</script>
