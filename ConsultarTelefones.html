<div class="telefones-container consulta-telefones-page">
  <div class="page-header consulta-page-header">
    <div>
      <h2>Consulta de Telefones</h2>
      <p>Selecione uma microrregião para consultar as comarcas e seus contatos.</p>
    </div>
    <button class="btn btn-secondary" type="button" onclick="window.print()">🖨️ Imprimir / PDF</button>
  </div>

  <div class="search-panel consulta-toolbar">
    <div class="search-box consulta-pesquisa-box">
      <span class="consulta-search-icon" aria-hidden="true">🔍</span>
      <input id="campo-pesquisa-consulta" type="search" placeholder="Pesquisar comarca..." autocomplete="off" oninput="filtrarComarcasConsulta()" aria-label="Pesquisar comarca">
    </div>
    <div class="consulta-filtro-microrregiao">
      <label for="filtro-microrregiao-consulta">Microrregião</label>
      <select id="filtro-microrregiao-consulta" onchange="selecionarMicrorregiaoConsulta()" aria-label="Selecionar microrregião">
        <option value="">Selecione uma microrregião</option>
      </select>
    </div>
  </div>

  <div class="consulta-layout" id="consulta-layout">
    <div class="consulta-lista painel-consulta-lista" id="consulta-lista">
      <div class="consulta-empty-state">
        <div class="consulta-empty-icon" aria-hidden="true">🗺️</div>
        <strong>Selecione uma microrregião</strong>
        <span>A lista de comarcas será exibida aqui.</span>
      </div>
    </div>

    <div class="consulta-detalhes painel-consulta-mapa" id="consulta-detalhes">
      <div id="consulta-mapa-container" class="consulta-mapa-container" aria-label="Mapa do Espírito Santo">
        <div class="consulta-mapa-placeholder">
          <div class="consulta-map-icon" aria-hidden="true">🗺️</div>
          <strong>Mapa do Espírito Santo</strong>
          <span>Selecione uma comarca para consultar os contatos.</span>
        </div>
      </div>
    </div>
  </div>
</div>
