<script>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: ConsultarJS.html
 * ==========================================================
 * Inicialização do dashboard e da consulta pública.
 */

function carregarTelefones() {
  if (typeof iniciarConsultaTelefones === "function") {
    iniciarConsultaTelefones();
  }
}

/*
 * O dashboard é calculado a partir da mesma fonte usada pela consulta.
 * Assim ele não depende de um formato específico do retorno de
 * carregarDashboard() e não fica preso nos valores iniciais 0.
 */
function carregarDashboard() {
  if (typeof API === "undefined" || typeof API.listarTelefones !== "function") {
    console.error("API.listarTelefones não está disponível.");
    return;
  }

  API.listarTelefones(function (resposta) {
    if (!resposta || resposta.sucesso !== true) {
      console.error("Falha ao carregar dados do dashboard:", resposta);
      return;
    }

    const telefones = Array.isArray(resposta.dados) ? resposta.dados : [];
    const setores = new Set();
    const tipos = new Set();
    const porTipo = {};
    const porComarca = {};

    telefones.forEach(item => {
      const comarca = String(obterCampoDashboard(item, ["comarca", "COMARCA", "Comarca"]) || "Sem comarca").trim();
      const setor = String(obterCampoDashboard(item, ["setor", "SETOR", "Setor"]) || "Sem setor").trim();
      const tipo = String(obterCampoDashboard(item, ["tipo", "TIPO", "Tipo"]) || "Não informado").trim();

      setores.add(comarca + "||" + setor);
      tipos.add(tipo);
      porTipo[tipo] = (porTipo[tipo] || 0) + 1;
      porComarca[comarca] = (porComarca[comarca] || 0) + 1;
    });

    atualizarTexto("total-telefones", telefones.length);
    atualizarTexto("total-setores", setores.size);
    atualizarTexto("total-tipos", tipos.size);

    renderizarResumoDashboard(
      document.getElementById("grafico-tipos"),
      porTipo,
      "Nenhum contato cadastrado."
    );

    renderizarResumoDashboard(
      document.getElementById("grafico-comarcas"),
      porComarca,
      "Nenhum contato cadastrado."
    );
  }, function (erro) {
    console.error("Erro ao carregar dashboard:", erro);
  });
}

function obterCampoDashboard(item, nomes) {
  if (!item) return "";
  const chaves = Object.keys(item);

  for (const nome of nomes) {
    if (Object.prototype.hasOwnProperty.call(item, nome)) return item[nome];

    const normalizado = String(nome)
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]/g, "")
      .toUpperCase();

    const encontrado = chaves.find(chave => String(chave)
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]/g, "")
      .toUpperCase() === normalizado);

    if (encontrado !== undefined) return item[encontrado];
  }

  return "";
}

function atualizarTexto(id, valor) {
  const elemento = document.getElementById(id);
  if (elemento) elemento.textContent = String(valor);
}

function renderizarResumoDashboard(container, dados, mensagemVazia) {
  if (!container) return;
  container.innerHTML = "";

  const entradas = Object.keys(dados || {})
    .map(nome => ({ nome, valor: Number(dados[nome]) || 0 }))
    .sort((a, b) => b.valor - a.valor || a.nome.localeCompare(b.nome, "pt-BR"));

  if (!entradas.length) {
    container.innerHTML = '<p style="color:#94a3b8; margin:0;">' + mensagemVazia + '</p>';
    return;
  }

  entradas.slice(0, 15).forEach(item => {
    const linha = document.createElement("div");
    linha.style.display = "flex";
    linha.style.justifyContent = "space-between";
    linha.style.alignItems = "center";
    linha.style.gap = "12px";
    linha.style.padding = "8px 0";
    linha.style.borderBottom = "1px solid #e2e8f0";

    const rotulo = document.createElement("span");
    rotulo.textContent = item.nome;
    rotulo.style.color = "#334155";

    const numero = document.createElement("strong");
    numero.textContent = String(item.valor);
    numero.style.color = "#0f172a";

    linha.appendChild(rotulo);
    linha.appendChild(numero);
    container.appendChild(linha);
  });
}

/*
 * A lista pública deve respeitar rigorosamente a ordem física da aba
 * TELEFONES. Não usamos ordem alfabética aqui: a primeira ocorrência
 * de cada comarca e de cada setor na resposta da API define sua posição.
 */
function aplicarOrdemTabelaTelefones() {
  if (typeof todosTelefones === "undefined" || !Array.isArray(todosTelefones) || !todosTelefones.length) {
    return false;
  }

  if (typeof campoTelefone !== "function" ||
      typeof setoresPorComarca === "undefined" ||
      typeof comarcasPorMicrorregiao === "undefined") {
    return false;
  }

  const ordemComarcas = [];
  const vistosComarcas = new Set();
  const ordemSetores = {};
  const vistosSetores = {};

  todosTelefones.forEach(item => {
    const comarca = String(campoTelefone(item, ["comarca", "COMARCA", "Comarca"]) || "Sem comarca").trim();
    const setor = String(campoTelefone(item, ["setor", "SETOR", "Setor"]) || "Sem setor").trim();

    if (!vistosComarcas.has(comarca)) {
      vistosComarcas.add(comarca);
      ordemComarcas.push(comarca);
    }

    if (!ordemSetores[comarca]) {
      ordemSetores[comarca] = [];
      vistosSetores[comarca] = new Set();
    }

    if (!vistosSetores[comarca].has(setor)) {
      vistosSetores[comarca].add(setor);
      ordemSetores[comarca].push(setor);
    }
  });

  Object.keys(ordemSetores).forEach(comarca => {
    if (Object.prototype.hasOwnProperty.call(setoresPorComarca, comarca)) {
      setoresPorComarca[comarca] = ordemSetores[comarca].slice();
    }
  });

  Object.keys(comarcasPorMicrorregiao).forEach(micro => {
    const existentes = new Set(comarcasPorMicrorregiao[micro] || []);
    comarcasPorMicrorregiao[micro] = ordemComarcas.filter(comarca => existentes.has(comarca));
  });

  return true;
}

/*
 * DashboardJS é carregado depois deste arquivo e recebe os dados da API
 * de forma assíncrona. Por isso esperamos os dados chegarem e só então
 * aplicamos a ordem da aba TELEFONES, sem alterar a ordem dos registros
 * de contatos dentro de cada setor.
 */
(function aguardarOrdemTabelaTelefones(tentativa) {
  const numeroTentativa = Number(tentativa || 0);
  const aplicar = aplicarOrdemTabelaTelefones();

  if (aplicar) {
    if (typeof microrregiaoSelecionada !== "undefined" && microrregiaoSelecionada &&
        typeof renderizarComarcas === "function") {
      renderizarComarcas();
    }
    return;
  }

  if (numeroTentativa < 30) {
    setTimeout(function () {
      aguardarOrdemTabelaTelefones(numeroTentativa + 1);
    }, 150);
  }
})(0);
</script>
