<script>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: ConsultarJS.html
 * ==========================================================
 * Funções de inicialização do dashboard e da consulta pública.
 */

function carregarTelefones() {
  if (typeof iniciarConsultaTelefones === "function") {
    iniciarConsultaTelefones();
  }
}

function carregarDashboard() {
  if (typeof API === "undefined" || typeof API.dashboard !== "function") {
    console.error("API.dashboard não está disponível.");
    return;
  }

  API.dashboard(function (resposta) {
    if (!resposta || resposta.sucesso !== true) {
      console.error("Falha ao carregar dashboard:", resposta);
      return;
    }

    const dados = resposta.dados || {};

    const totalTelefones = obterNumeroDashboard(dados, [
      "totalTelefones", "total_telefones", "totalContatos", "total_contatos", "quantidadeTelefones"
    ]);
    const totalSetores = obterNumeroDashboard(dados, [
      "totalSetores", "total_setores", "quantidadeSetores"
    ]);
    const totalTipos = obterNumeroDashboard(dados, [
      "totalTipos", "total_tipos", "tiposCadastrados", "quantidadeTipos"
    ]);

    atualizarTexto("total-telefones", totalTelefones);
    atualizarTexto("total-setores", totalSetores);
    atualizarTexto("total-tipos", totalTipos);

    renderizarResumoDashboard(
      document.getElementById("grafico-tipos"),
      obterColecaoDashboard(dados, ["porTipo", "por_tipo", "tipos", "contatosPorTipo"]),
      "Nenhum dado por tipo disponível."
    );

    renderizarResumoDashboard(
      document.getElementById("grafico-comarcas"),
      obterColecaoDashboard(dados, ["porComarca", "por_comarca", "comarcas", "contatosPorComarca"]),
      "Nenhum dado por comarca disponível."
    );
  }, function (erro) {
    console.error("Erro ao carregar dashboard:", erro);
  });
}

function obterNumeroDashboard(dados, nomes) {
  for (const nome of nomes) {
    if (Object.prototype.hasOwnProperty.call(dados, nome)) {
      const numero = Number(dados[nome]);
      if (Number.isFinite(numero)) return numero;
    }
  }
  return 0;
}

function obterColecaoDashboard(dados, nomes) {
  for (const nome of nomes) {
    if (Object.prototype.hasOwnProperty.call(dados, nome)) {
      const valor = dados[nome];
      if (Array.isArray(valor)) return valor;
      if (valor && typeof valor === "object") {
        return Object.keys(valor).map(chave => ({
          nome: chave,
          valor: valor[chave]
        }));
      }
    }
  }
  return [];
}

function atualizarTexto(id, valor) {
  const elemento = document.getElementById(id);
  if (elemento) elemento.textContent = String(valor);
}

function renderizarResumoDashboard(container, dados, mensagemVazia) {
  if (!container) return;
  container.innerHTML = "";

  if (!dados || !dados.length) {
    container.innerHTML = '<p style="color:#94a3b8; margin:0;">' + mensagemVazia + '</p>';
    return;
  }

  dados.slice(0, 15).forEach(item => {
    let nome = "";
    let valor = 0;

    if (item && typeof item === "object" && !Array.isArray(item)) {
      nome = item.nome ?? item.NOME ?? item.tipo ?? item.TIPO ?? item.comarca ?? item.COMARCA ?? item.label ?? item.name ?? "";
      valor = Number(item.valor ?? item.VALOR ?? item.quantidade ?? item.QUANTIDADE ?? item.total ?? item.TOTAL ?? 0);
    } else {
      nome = String(item);
    }

    if (!Number.isFinite(valor)) valor = 0;

    const linha = document.createElement("div");
    linha.style.display = "flex";
    linha.style.justifyContent = "space-between";
    linha.style.alignItems = "center";
    linha.style.gap = "12px";
    linha.style.padding = "8px 0";
    linha.style.borderBottom = "1px solid #e2e8f0";

    const rotulo = document.createElement("span");
    rotulo.textContent = String(nome || "-");
    rotulo.style.color = "#334155";

    const numero = document.createElement("strong");
    numero.textContent = String(valor);
    numero.style.color = "#0f172a";

    linha.appendChild(rotulo);
    linha.appendChild(numero);
    container.appendChild(linha);
  });
}
</script>
