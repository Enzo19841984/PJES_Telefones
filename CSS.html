<style>
/**
 * ==========================================================
 * SISTEMA DE TELEFONES TJES
 * Arquivo: CSS.html
 * ==========================================================
 */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f6fa;
  color: #1f2937;
}

body {
  min-width: 0;
}

.hidden {
  display: none !important;
}

#app,
.app-container {
  display: flex;
  width: 100%;
  height: 100vh;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

#sidebar-container {
  flex: 0 0 auto;
}

.main-container,
.main-content {
  flex: 1 1 auto;
  width: calc(100% - 260px);
  max-width: 100%;
  height: 100vh;
  min-width: 0;
  padding: 25px;
  overflow-y: auto;
  overflow-x: hidden;
}

.sidebar {
  width: 260px;
  min-width: 260px;
  height: 100vh;
  flex-shrink: 0;
  overflow-y: auto;
  background: #1e293b;
  color: #ffffff;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 25px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.sidebar-header h2 {
  margin: 0;
  font-size: 28px;
}

.sidebar-header span {
  font-size: 14px;
  opacity: 0.7;
}

.sidebar-menu {
  padding: 15px;
  flex: 1;
}

.menu-item {
  width: 100%;
  border: 0;
  background: transparent;
  color: #ffffff;
  padding: 12px 15px;
  margin-bottom: 5px;
  text-align: left;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.menu-item:hover,
.menu-item.active {
  background: rgba(255, 255, 255, 0.15);
}

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 25px;
  width: 100%;
}

.system-title {
  min-width: 0;
}

.system-title h1 {
  margin: 0;
  font-size: 24px;
  line-height: 1.25;
}

.user-info {
  flex: 0 0 auto;
  font-size: 14px;
  color: #64748b;
}

.dashboard-container,
.telefones-container {
  width: 100%;
  max-width: 100%;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
  width: 100%;
}

.page-header h2,
.page-header h3,
.page-header p {
  margin-top: 0;
}

.dashboard-cards {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(220px, 1fr)
  );
  gap: 20px;
  width: 100%;
}

.card,
.panel,
.search-panel,
.table-panel {
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.card {
  width: 100%;
  padding: 20px;
}

.card-title {
  color: #64748b;
  font-size: 14px;
}

.card-value {
  margin-top: 10px;
  font-size: 32px;
  font-weight: bold;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(300px, 1fr)
  );
  gap: 20px;
  margin-top: 20px;
  width: 100%;
}

.panel {
  width: 100%;
  padding: 20px;
}

.search-panel {
  width: 100%;
  padding: 20px;
  margin-bottom: 20px;
}

.search-box {
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 12px 12px 12px 36px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 15px;
  width: 100%;
}

.filter-group {
  flex: 1 1 160px;
  min-width: 160px;
}

.filters select,
.filter-group select {
  width: 100%;
  padding: 10px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  background: #ffffff;
}

.table-panel {
  width: 100%;
  padding: 20px;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
}

.data-table th {
  padding: 12px;
  background: #f1f5f9;
  text-align: left;
  font-weight: 600;
  color: #475569;
  white-space: nowrap;
}

.data-table td {
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
  vertical-align: middle;
}

.data-table tbody tr {
  transition: background-color 0.15s ease-in-out;
}

.data-table tbody tr:hover {
  background-color: #f1f5f9;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s ease-in-out;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  cursor: wait;
  opacity: 0.7;
  transform: none;
}

.btn-primary {
  background: #2563eb;
  color: #ffffff;
}

.btn-primary:hover {
  background: #1d4ed8;
}

.btn-danger {
  background: #dc2626;
  color: #ffffff;
}

.btn-danger:hover {
  background: #b91c1c;
}

.btn-secondary {
  background: #64748b;
  color: #ffffff;
}

.btn-secondary:hover {
  background: #475569;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.45);
}

.modal-content {
  width: 700px;
  max-width: 100%;
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}

.modal-small {
  width: 400px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 20px;
  border-bottom: 1px solid #e5e7eb;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
}

.modal-body {
  padding: 20px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-top: 1px solid #e5e7eb;
}

.modal-close {
  border: 0;
  background: transparent;
  color: #64748b;
  font-size: 25px;
  cursor: pointer;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.form-group.full {
  grid-column: span 2;
}

.form-group label {
  font-weight: 600;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  margin-top: 5px;
  padding: 10px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font: inherit;
}

.form-group textarea {
  min-height: 90px;
  resize: vertical;
}

.modal-alert {
  max-width: 380px;
  padding: 8px 12px;
  border: 1px solid #f5c2c7;
  border-radius: 6px;
  background: #f8d7da;
  color: #842029;
  font-size: 13px;
  line-height: 1.3;
}

.toast-container {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: min(420px, calc(100vw - 40px));
}

.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px 16px;
  border-left: 5px solid #64748b;
  border-radius: 8px;
  background: #ffffff;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
  color: #1f2937;
  font-size: 14px;
}

.toast.success {
  border-left-color: #16a34a;
}

.toast.error {
  border-left-color: #dc2626;
}

.toast.warning {
  border-left-color: #f59e0b;
}

.toast.info {
  border-left-color: #2563eb;
}

@media (max-width: 900px) {
  .sidebar {
    width: 80px;
    min-width: 80px;
  }

  .main-container,
  .main-content {
    width: calc(100% - 80px);
    padding: 18px;
  }

  .sidebar-header {
    padding: 18px 10px;
    text-align: center;
  }

  .sidebar-header h2 {
    font-size: 22px;
  }

  .sidebar-header span,
  .menu-item span:not(.icon) {
    display: none;
  }

  .menu-item {
    justify-content: center;
    padding: 12px 8px;
  }

  .topbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .system-title h1 {
    font-size: 19px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-group.full {
    grid-column: span 1;
  }

  .modal-footer {
    flex-direction: column;
    align-items: stretch;
  }

  .modal-footer > div {
    width: 100%;
  }
}

@media print {
  @page {
    size: A4 portrait;
    margin: 12mm 10mm;
  }

  html,
  body,
  #app,
  .app-container,
  .main-container,
  .main-content {
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    overflow: visible !important;
    position: static !important;
    display: block !important;
  }

  .sidebar,
  .topbar,
  button,
  .btn,
  select,
  input,
  .no-print,
  label[for="select-ordem-historico"],
  #select-ordem-historico {
    display: none !important;
  }

  body {
    background: #ffffff !important;
    color: #000000 !important;
  }

  .table-panel {
    padding: 0 !important;
    overflow: visible !important;
    background: transparent !important;
    box-shadow: none !important;
  }

  #tabela-historico-print {
    width: 100% !important;
    table-layout: fixed !important;
    border-collapse: collapse !important;
  }

  #tabela-historico-print thead {
    display: table-header-group !important;
  }

  #tabela-historico-print tr {
    page-break-inside: avoid !important;
  }

  #tabela-historico-print th:nth-child(1),
  #tabela-historico-print td:nth-child(1) {
    width: 22% !important;
  }

  #tabela-historico-print th:nth-child(2),
  #tabela-historico-print td:nth-child(2) {
    width: 23% !important;
  }

  #tabela-historico-print th:nth-child(3),
  #tabela-historico-print td:nth-child(3) {
    width: 15% !important;
    text-align: center !important;
  }

  #tabela-historico-print th:nth-child(4),
  #tabela-historico-print td:nth-child(4) {
    width: 40% !important;
  }

  #tabela-historico-print th,
  #tabela-historico-print td {
    padding: 6px 5px !important;
    border: 1px solid #cbd5e1 !important;
    font-size: 11px !important;
    word-break: break-word !important;
  }

  #tabela-historico-print td:nth-child(3) span {
    display: inline-block !important;
    white-space: nowrap !important;
  }
}

:root {
  --bg: #f5f6fa;
  --bg-panel: #ffffff;
  --text: #1f2937;
  --text-secondary: #64748b;
}
.dark-mode {
  --bg: #0f172a;
  --bg-panel: #1e293b;
  --text: #f1f5f9;
  --text-secondary: #94a3b8;
}
body { background: var(--bg); color: var(--text); }
.panel, .card, .search-panel, .table-panel { background: var(--bg-panel); }

</style>
